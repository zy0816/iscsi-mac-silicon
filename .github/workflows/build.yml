name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed so softprops/action-gh-release can create/update the GitHub Release
# (default GITHUB_TOKEN is read-only for contents otherwise).
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14        # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swiftc --version
          uname -m

      - name: Build kext + user tools
        run: ./build_all.sh

      - name: Build SwiftUI app
        run: cd App && ./build_app.sh

      - name: Build installer (.pkg + .dmg)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^VERSION=\"\\([^\"]*\\)\"/\\1/p' build_kext.sh | head -1)"
          fi
          cd Installer && ./build_installer.sh "$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iSCSI-for-Apple-Silicon
          path: |
            build/*.dmg
            build/*.pkg
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
            build/*.pkg
